
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinema Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #181818;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #222;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 5px solid #b90012;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #bbb;
            margin-bottom: 0;
        }

        .container {
            width: min(1100px, 94%);
            margin: 30px auto;
        }

        .painel {
            background: #242424;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 35px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 7px;
            font-size: 16px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #d00016;
        }

        input::placeholder, textarea::placeholder {
            color: #aaa;
        }

        textarea {
            resize: vertical;
        }

        .campo-largo {
            grid-column: 1 / -1;
        }

        .acoes {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }

        button {
            background: #bd0015;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 17px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e00019;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .sucesso {
            color: #65db85;
            font-weight: bold;
        }

        .erro {
            color: #ff7070;
            font-weight: bold;
        }

        .titulo-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .botao-atualizar {
            padding: 12px 18px;
            font-size: 14px;
        }

        .lista-filmes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #242424;
            border: 1px solid #444;
            border-radius: 10px;
            overflow: hidden;
        }

        .card-imagem {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #333;
        }

        .imagem-placeholder {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #333;
            font-size: 50px;
        }

        .card-conteudo {
            padding: 18px;
        }

        .card h3 {
            color: #ff5a67;
            margin-top: 0;
            font-size: 21px;
            overflow-wrap: anywhere;
        }

        .card p {
            color: #ccc;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .descricao {
            border-top: 1px solid #444;
            padding-top: 12px;
        }

        .estado {
            color: #bbb;
            padding: 15px 0;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #999;
            border-top: 1px solid #333;
        }

        footer span {
            color: #d00016;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-largo {
                grid-column: auto;
            }

            .titulo-lista {
                flex-direction: column;
                align-items: flex-start;
            }

            .painel {
                padding: 18px;
            }
        }

    </style>

</head>

<body>

<header>
    <h1>🎬 CINEMA CADASTRO</h1>
    <p>Cadastre, organize e explore seus filmes favoritos!</p>
</header>

<main class="container">

    <section class="painel">

        <h2>▦ Cadastrar novo filme</h2>

        <form id="formFilme">

            <div class="form-grid">

                <label>
                    Nome do filme
                    <input type="text" id="nomeFilme"
                           placeholder="Ex.: Interestelar" required>
                </label>

                <label>
                    Gênero
                    <input type="text" id="genero"
                           placeholder="Ex.: Ficção científica" required>
                </label>

                <label>
                    Diretor
                    <input type="text" id="diretor"
                           placeholder="Ex.: Christopher Nolan" required>
                </label>

                <label>
                    Plataforma
                    <input type="text" id="plataforma"
                           placeholder="Ex.: Cinema, Netflix, Prime Video" required>
                </label>

                <label>
                    Ano de lançamento
                    <input type="number" id="anoLancamento"
                           min="1888" max="2100" required>
                </label>

                <label>
                    Duração (minutos)
                    <input type="number" id="duracao"
                           min="1" placeholder="Ex.: 169" required>
                </label>

                <label>
                    Classificação indicativa
                    <input type="text" id="classificacao"
                           placeholder="Ex.: 10 anos" required>
                </label>

                <label class="campo-largo">
                    URL da imagem do filme
                    <input type="url" id="imagem"
                           placeholder="https://exemplo.com/imagem.jpg">
                </label>

                <label class="campo-largo">
                    Descrição / Sinopse
                    <textarea id="descricao" rows="4"
                              placeholder="Descreva o filme..."></textarea>
                </label>

            </div>

            <div class="acoes">

                <button type="submit" id="btnCadastrar">
                    ✚ Cadastrar filme
                </button>

                <p id="mensagem" role="status" aria-live="polite"></p>

            </div>

        </form>

    </section>

    <section>

        <div class="titulo-lista">

            <h2>▦ Filmes cadastrados</h2>

            <button type="button" class="botao-atualizar"
                    id="btnAtualizar">
                ↻ Atualizar
            </button>

        </div>

        <div id="listaFilmes" class="lista-filmes">

            <p class="estado">Carregando filmes...</p>

        </div>

    </section>

</main>

<footer>
    CINEMACADASTRO <span>•</span> Seu catálogo de filmes começa aqui.
</footer>

<script>

    // Endereço da API Spring Boot
    const API_URL = "http://localhost:8080/api/filmes";

    const formFilme = document.getElementById("formFilme");
    const listaFilmes = document.getElementById("listaFilmes");
    const mensagem = document.getElementById("mensagem");
    const btnCadastrar = document.getElementById("btnCadastrar");


    // GET: listar filmes cadastrados
    async function listarFilmes() {

        listaFilmes.innerHTML =
            '<p class="estado">Buscando filmes...</p>';

        try {

            const resposta = await fetch(API_URL);

            if (!resposta.ok) {
                throw new Error("Erro HTTP: " + resposta.status);
            }

            const filmes = await resposta.json();

            listaFilmes.innerHTML = "";

            if (filmes.length === 0) {

                listaFilmes.innerHTML =
                    '<p class="estado">Nenhum filme cadastrado ainda.</p>';

                return;
            }

            filmes.forEach((filme) => {

                const card = document.createElement("article");
                card.className = "card";

                // Imagem
                let areaImagem;

                if (filme.imagem) {

                    areaImagem = document.createElement("img");
                    areaImagem.className = "card-imagem";
                    areaImagem.src = filme.imagem;
                    areaImagem.alt = "Capa de " + (filme.nomeFilme || "");
                    areaImagem.loading = "lazy";

                    areaImagem.onerror = function() {

                        const placeholder = document.createElement("div");
                        placeholder.className = "imagem-placeholder";
                        placeholder.textContent = "🎬";

                        areaImagem.replaceWith(placeholder);
                    };

                } else {

                    areaImagem = document.createElement("div");
                    areaImagem.className = "imagem-placeholder";
                    areaImagem.textContent = "🎬";

                }

                const conteudo = document.createElement("div");
                conteudo.className = "card-conteudo";

                // Nome do filme
                const nome = document.createElement("h3");
                nome.textContent = "🎬 " + (filme.nomeFilme || "Filme sem nome");

                // Gênero
                const genero = document.createElement("p");
                genero.textContent = "🎭 Gênero: " + (filme.genero || "-");

                // Diretor
                const diretor = document.createElement("p");
                diretor.textContent = "🎥 Diretor: " + (filme.diretor || "-");

                // Plataforma
                const plataforma = document.createElement("p");
                plataforma.textContent = "📺 Plataforma: " + (filme.plataforma || "-");

                // Ano
                const ano = document.createElement("p");
                ano.textContent = "📅 Lançamento: " + (filme.anoLancamento ?? "-");

                // Duração
                const duracao = document.createElement("p");
                duracao.textContent = "⏱ Duração: " + (filme.duracao ?? "-") + " minutos";

                // Classificação
                const classificacao = document.createElement("p");
                classificacao.textContent = "🔞 Classificação: " + (filme.classificacao || "-");

                // Descrição
                const descricao = document.createElement("p");
                descricao.className = "descricao";
                descricao.textContent = filme.descricao || "Sem descrição cadastrada.";

                conteudo.append(
                    nome,
                    genero,
                    diretor,
                    plataforma,
                    ano,
                    duracao,
                    classificacao,
                    descricao
                );

                card.append(areaImagem, conteudo);

                listaFilmes.appendChild(card);

            });

        } catch (erro) {

            console.error("Erro ao buscar filmes:", erro);

            listaFilmes.innerHTML =
                '<p class="estado erro">Não foi possível carregar os filmes. Verifique se a API está funcionando.</p>';

        }

    }


    // POST: cadastrar filme
    formFilme.addEventListener("submit", async function(event) {

        event.preventDefault();

        const filme = {

            nomeFilme: document.getElementById("nomeFilme").value.trim(),

            genero: document.getElementById("genero").value.trim(),

            diretor: document.getElementById("diretor").value.trim(),

            plataforma: document.getElementById("plataforma").value.trim(),

            anoLancamento: Number(document.getElementById("anoLancamento").value),

            duracao: Number(document.getElementById("duracao").value),

            classificacao: document.getElementById("classificacao").value.trim(),

            imagem: document.getElementById("imagem").value.trim(),

            descricao: document.getElementById("descricao").value.trim()

        };

        mensagem.textContent = "Cadastrando filme...";
        mensagem.className = "";

        btnCadastrar.disabled = true;

        try {

            const resposta = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(filme)

            });

            if (!resposta.ok) {

                const detalhe = await resposta.text();

                throw new Error(detalhe || "Erro HTTP: " + resposta.status);

            }

            mensagem.textContent = "✔ Filme cadastrado com sucesso!";
            mensagem.className = "sucesso";

            formFilme.reset();

            await listarFilmes();

        } catch (erro) {

            console.error("Erro ao cadastrar filme:", erro);

            mensagem.textContent =
                "✖ Não foi possível cadastrar o filme. Verifique a API.";

            mensagem.className = "erro";

        } finally {

            btnCadastrar.disabled = false;

        }

    });


    // Atualizar catálogo
    document.getElementById("btnAtualizar")
        .addEventListener("click", listarFilmes);


    // Carregar filmes ao abrir a página
    listarFilmes();

</script>

</body>
</html>

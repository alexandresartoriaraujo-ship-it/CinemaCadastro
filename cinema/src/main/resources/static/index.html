
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCadastro - Cadastro de Filmes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: white;
        }

        header {
            background-color: #1f1f1f;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #e50914;
        }

        header h1 {
            color: #e50914;
            font-size: 32px;
        }

        header p {
            color: #ccc;
            margin-top: 8px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .formulario {
            background-color: #222;
            padding: 30px;
            border-radius: 10px;
        }

        .formulario h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #e50914;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .campo input,
        .campo textarea,
        .campo select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: white;
            outline: none;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            border-color: #e50914;
        }

        .campo textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #b20710;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background-color: #1f1f1f;
            color: #888;
        }

    </style>
</head>

<body>

<header>
    <h1>CineCadastro</h1>
    <p>Sistema de Cadastro de Filmes</p>
</header>

<div class="container">

    <div class="formulario">

        <h2>Cadastrar Novo Filme</h2>

        <form>

            <div class="campo">
                <label for="id">ID do Filme</label>
                <input type="number" id="id" name="id" placeholder="Digite o ID">
            </div>

            <div class="campo">
                <label for="nomeFilme">Nome do Filme</label>
                <input type="text" id="nomeFilme" name="nomeFilme" placeholder="Digite o nome do filme">
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <select id="genero" name="genero">
                    <option value="">Selecione o gênero</option>
                    <option value="Ação">Ação</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Comédia">Comédia</option>
                    <option value="Drama">Drama</option>
                    <option value="Terror">Terror</option>
                    <option value="Ficção Científica">Ficção Científica</option>
                    <option value="Romance">Romance</option>
                    <option value="Animação">Animação</option>
                </select>
            </div>

            <div class="campo">
                <label for="diretor">Diretor</label>
                <input type="text" id="diretor" name="diretor" placeholder="Nome do diretor">
            </div>

            <div class="campo">
                <label for="anoLancamento">Ano de Lançamento</label>
                <input type="number" id="anoLancamento" name="anoLancamento" placeholder="Ex: 2025">
            </div>

            <div class="campo">
                <label for="duracao">Duração (minutos)</label>
                <input type="number" id="duracao" name="duracao" placeholder="Ex: 120">
            </div>

            <div class="campo">
                <label for="classificacao">Classificação Indicativa</label>
                <select id="classificacao" name="classificacao">
                    <option value="">Selecione a classificação</option>
                    <option value="Livre">Livre</option>
                    <option value="10 anos">10 anos</option>
                    <option value="12 anos">12 anos</option>
                    <option value="14 anos">14 anos</option>
                    <option value="16 anos">16 anos</option>
                    <option value="18 anos">18 anos</option>
                </select>
            </div>

            <div class="campo">
                <label for="imagem">Imagem do Filme (URL)</label>
                <input type="text" id="imagem" name="imagem" placeholder="Cole o link da imagem">
            </div>

            <div class="campo">
                <label for="descricao">Descrição / Sinopse</label>
                <textarea id="descricao" name="descricao" placeholder="Digite a sinopse do filme"></textarea>
            </div>

            <button type="submit">Cadastrar Filme</button>

        </form>

    </div>

</div>

<footer>
    <p>© 2026 CineCadastro - Sistema de Gerenciamento de Filmes</p>
</footer>

</body>
</html>

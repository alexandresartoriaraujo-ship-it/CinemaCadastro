<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinema – Cadastro de filmes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1216; --surface: #261a20; --line: #3b2a32;
            --text: #f3e9e4; --muted: #b5a29c; --red: #c8323f; --gold: #e0b252;
            --display: "Bebas Neue", Impact, sans-serif;
            --body: "DM Sans", system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); }
        button, input, select, textarea { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 64px; }
        h1 { font: 400 clamp(48px, 10vw, 84px)/.9 var(--display); letter-spacing: .02em; margin: 0 0 8px; }
        h2 { font: 400 40px/1 var(--display); letter-spacing: .02em; margin: 0; }
        .sub { color: var(--muted); margin: 0 0 32px; }

        form { max-width: 640px; }
        label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
        input, select, textarea { display: block; width: 100%; margin-top: 4px; background: var(--surface);
            border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--text); }
        textarea { resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .check { display: flex; align-items: center; gap: 8px; color: var(--text); }
        .check input { width: auto; margin: 0; }

        .btn { background: var(--red); border: 0; border-radius: 6px; padding: 12px 22px; font-weight: 700; cursor: pointer; }
        .btn:hover { filter: brightness(1.12); }
        .btn:disabled { opacity: .6; cursor: wait; }
        .btn.ghost { background: transparent; border: 1px solid var(--line); padding: 8px 16px; }
        .actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }

        #msg { margin: 0; font-size: 14px; }
        #msg.ok { color: #7ddc9a; }
        #msg.erro { color: #ff8a93; }

        .lista-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between;
            border-top: 1px solid var(--line); margin-top: 48px; padding-top: 32px; }
        .lista-head p { margin: 0; color: var(--muted); font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; margin-top: 24px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .poster { aspect-ratio: 2/3; background: var(--bg); display: grid; place-items: center; position: relative; }
        .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .poster .ph { font: 400 28px/1.1 var(--display); color: var(--muted); padding: 16px; text-align: center; }
        .tag { position: absolute; top: 8px; left: 8px; background: var(--bg); border: 1px solid var(--line);
            border-radius: 4px; padding: 0 7px; font-size: 13px; font-weight: 700; }
        .id { position: absolute; top: 8px; right: 8px; background: var(--gold); color: #1a1216;
            border-radius: 4px; padding: 0 7px; font-size: 13px; font-weight: 700; }
        .info { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .info h3 { font: 400 28px/1.05 var(--display); letter-spacing: .02em; margin: 0; }
        .meta { color: var(--muted); font-size: 14px; margin: 0; }
        .sinopse { font-size: 14px; margin: 4px 0 0; }
        dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
        dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
        .status { font-size: 13px; font-weight: 700; margin-top: auto; padding-top: 8px; }
        .status.on { color: #7ddc9a; } .status.off { color: var(--muted); }
        .info a { color: var(--gold); font-size: 14px; }

        .state { text-align: center; color: var(--muted); padding: 48px 0; }
        .state.erro { color: #ff8a93; }

        @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <h1>Cadastrar filme</h1>
    <p class="sub">Preencha os dados e salve. O filme aparece na lista logo abaixo.</p>

    <form id="form">
        <label>Título <input name="titulo" required></label>
        <label>Sinopse <textarea name="sinopse" rows="4"></textarea></label>

        <div class="row">
            <label>Gênero <input name="genero" required></label>
            <label>Classificação
                <select name="classificacao">
                    <option>Livre</option><option>10</option><option>12</option>
                    <option>14</option><option>16</option><option>18</option>
                </select>
            </label>
        </div>

        <div class="row">
            <label>Duração (minutos) <input name="duracao" type="number" min="1" required></label>
            <label>Ano de lançamento <input name="anoLancamento" type="number" min="1888" max="2100" required></label>
        </div>

        <div class="row">
            <label>Diretor <input name="diretor"></label>
            <label>Idioma <input name="idioma" placeholder="Dublado, Legendado…"></label>
        </div>

        <label>Formato
            <select name="formato"><option>2D</option><option>3D</option><option>IMAX</option></select>
        </label>
        <label>URL da imagem (pôster) <input name="imagem" type="url" placeholder="https://…"></label>
        <label>URL do trailer <input name="trailer" type="url" placeholder="https://…"></label>
        <label class="check"><input name="disponivel" type="checkbox" checked> Em cartaz</label>

        <div class="actions">
            <button type="submit" class="btn" id="btnSalvar">Salvar filme</button>
            <p id="msg" role="status"></p>
        </div>
    </form>

    <section>
        <div class="lista-head">
            <div>
                <h2>Filmes cadastrados</h2>
                <p id="contagem"></p>
            </div>
            <button type="button" class="btn ghost" id="btnAtualizar">Atualizar lista</button>
        </div>
        <div id="lista" class="grid"></div>
        <div id="estado" class="state">Carregando filmes…</div>
    </section>
</main>

<script>
    // Mesma origem (index.html em src/main/resources/static).
    // Se abrir o arquivo de outro lugar, use "http://localhost:8080/api/filmes".
    const API = "/api/filmes";
    const $ = (id) => document.getElementById(id);
    const form = $("form"), msg = $("msg"), btn = $("btnSalvar");

    function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function posterHtml(f) {
        const ph = `<span class="ph">${esc(f.titulo)}</span>`;
        if (!f.imagem) return ph;
        const img = document.createElement("img");
        img.src = f.imagem;
        img.alt = "Pôster de " + f.titulo;
        img.loading = "lazy";
        img.setAttribute("onerror", "this.outerHTML=this.dataset.ph");
        img.dataset.ph = ph;
        return img.outerHTML;
    }

    function cardHtml(f) {
        const trailer = /^https?:\/\//.test(f.trailer || "")
            ? `<a href="${esc(f.trailer)}" target="_blank" rel="noopener">Ver trailer</a>` : "";
        return `
      <article class="card">
        <div class="poster">${posterHtml(f)}
          <span class="tag">${esc(f.classificacao)}</span>
          <span class="id">#${f.id}</span>
        </div>
        <div class="info">
          <h3>${esc(f.titulo)}</h3>
          <p class="meta">${esc(f.genero)} · ${f.duracao} min · ${f.anoLancamento}</p>
          <p class="sinopse">${esc(f.sinopse) || "Sem sinopse."}</p>
          <dl>
            <dt>Diretor</dt><dd>${esc(f.diretor) || "–"}</dd>
            <dt>Idioma</dt><dd>${esc(f.idioma) || "–"}</dd>
            <dt>Formato</dt><dd>${esc(f.formato) || "–"}</dd>
          </dl>
          ${trailer}
          <span class="status ${f.disponivel ? "on" : "off"}">${f.disponivel ? "Em cartaz" : "Fora de cartaz"}</span>
        </div>
      </article>`;
    }

    async function carregar() {
        const st = $("estado");
        try {
            const r = await fetch(API);
            if (!r.ok) throw new Error("Erro " + r.status);
            const filmes = await r.json();
            // mais recentes primeiro
            filmes.sort((a, b) => b.id - a.id);
            $("lista").innerHTML = filmes.map(cardHtml).join("");
            $("contagem").textContent = filmes.length === 1 ? "1 filme" : filmes.length + " filmes";
            st.hidden = filmes.length > 0;
            st.className = "state";
            st.textContent = "Nenhum filme cadastrado ainda. Use o formulário acima para adicionar o primeiro.";
        } catch (e) {
            $("lista").innerHTML = "";
            $("contagem").textContent = "";
            st.hidden = false;
            st.className = "state erro";
            st.textContent = "Não foi possível carregar os filmes. Verifique se a API está rodando e clique em Atualizar lista.";
        }
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const filme = {
            titulo: fd.get("titulo").trim(),
            sinopse: fd.get("sinopse").trim(),
            genero: fd.get("genero").trim(),
            classificacao: fd.get("classificacao"),
            duracao: Number(fd.get("duracao")),
            diretor: fd.get("diretor").trim(),
            anoLancamento: Number(fd.get("anoLancamento")),
            idioma: fd.get("idioma").trim(),
            formato: fd.get("formato"),
            imagem: fd.get("imagem").trim(),
            trailer: fd.get("trailer").trim(),
            disponivel: fd.get("disponivel") === "on",
        };

        btn.disabled = true;
        btn.textContent = "Salvando…";
        msg.className = ""; msg.textContent = "";
        try {
            const r = await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(filme),
            });
            if (!r.ok) throw new Error("Erro " + r.status);
            const salvo = await r.json();
            msg.className = "ok";
            msg.textContent = "Filme salvo com sucesso (código " + salvo.id + ").";
            form.reset();
            form.elements.disponivel.checked = true;
            await carregar();
        } catch (err) {
            msg.className = "erro";
            msg.textContent = "Não foi possível salvar o filme. Verifique se a API está rodando e tente de novo.";
        } finally {
            btn.disabled = false;
            btn.textContent = "Salvar filme";
        }
    });

    // Para testar no Postman: atualiza ao clicar, ao voltar para a aba e a cada 10 s.
    $("btnAtualizar").addEventListener("click", carregar);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });
    setInterval(carregar, 10000);

    carregar();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaCadastro | Catálogo de Filmes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #151515, #292020, #111);
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: #1c1c1c;
            border-bottom: 5px solid #e50914;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
            color: #e50914;
        }

        header p {
            color: #ccc;
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .painel {
            background: #222;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        h2 {
            color: #e50914;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #e50914;
        }

        input::placeholder, textarea::placeholder {
            color: #aaa;
        }

        textarea {
            resize: vertical;
        }

        .campo-largo {
            grid-column: 1 / -1;
        }

        .acoes {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 5px;
            background: #e50914;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #b20710;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #mensagem {
            font-weight: bold;
        }

        .sucesso {
            color: #70e070;
        }

        .erro {
            color: #ff7777;
        }

        .secao-filmes {
            margin-top: 40px;
        }

        .titulo-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .lista-filmes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .card {
            overflow: hidden;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 5px 12px rgba(0,0,0,.4);
        }

        .card-imagem {
            display: block;
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #333;
        }

        .card-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 170px;
            font-size: 45px;
            background: linear-gradient(135deg, #4b1515, #222);
        }

        .card-faixa {
            height: 5px;
            background: #e50914;
        }

        .card-conteudo {
            padding: 18px;
        }

        .card h3 {
            margin-top: 0;
            color: #ff4545;
            font-size: 21px;
        }

        .card p {
            color: #ccc;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .descricao {
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        .estado {
            color: #ccc;
            grid-column: 1 / -1;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: #1c1c1c;
            color: #999;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-largo {
                grid-column: auto;
            }

            .titulo-lista {
                align-items: flex-start;
                flex-direction: column;
            }

            header h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>🎬 CINEMACADASTRO</h1>
    <p>Cadastre, explore e descubra seus filmes favoritos!</p>
</header>

<main class="container">

    <section class="painel">

        <h2>▦ Cadastrar novo filme</h2>

        <form id="formFilme">

            <div class="form-grid">

                <label>
                    ID do filme
                    <input type="number" id="id" placeholder="Ex: 1" required>
                </label>

                <label>
                    Nome do filme
                    <input type="text" id="nome" placeholder="Ex: Interestelar" required>
                </label>

                <label>
                    Gênero
                    <input type="text" id="genero" placeholder="Ex: Ficção Científica" required>
                </label>

                <label>
                    Plataforma
                    <input type="text" id="plataforma" placeholder="Ex: Cinema" required>
                </label>

                <label>
                    Ano de lançamento
                    <input type="number" id="anoLancamento"
                           placeholder="Ex: 2014" min="1888" max="2100" required>
                </label>

                <label class="campo-largo">
                    URL da imagem do filme
                    <input type="url" id="imagem"
                           placeholder="https://exemplo.com/imagem.jpg">
                </label>

                <label class="campo-largo">
                    Descrição / Sinopse
                    <textarea id="descricao" rows="4"
                              placeholder="Conte um pouco sobre o filme..."></textarea>
                </label>

            </div>

            <div class="acoes">

                <button type="submit" id="btnCadastrar">
                    ✚ Cadastrar filme
                </button>

                <p id="mensagem" role="status"></p>

            </div>

        </form>

    </section>


    <section class="secao-filmes">

        <div class="titulo-lista">

            <h2>▦ Filmes cadastrados</h2>

            <button type="button" id="btnAtualizar">
                ↻ Atualizar
            </button>

        </div>

        <div id="listaFilmes" class="lista-filmes">

            <p class="estado">Carregando filmes...</p>

        </div>

    </section>

</main>

<footer>
    CINEMACADASTRO • Seu catálogo de filmes começa aqui.
</footer>


<script>

    const API_URL = "http://localhost:8080/api/filmes";

    const formFilme = document.getElementById("formFilme");
    const listaFilmes = document.getElementById("listaFilmes");
    const mensagem = document.getElementById("mensagem");
    const btnCadastrar = document.getElementById("btnCadastrar");


    // GET: Buscar filmes cadastrados

    async function listarFilmes() {

        listaFilmes.innerHTML =
            '<p class="estado">Buscando filmes...</p>';

        try {

            const resposta = await fetch(API_URL);

            if (!resposta.ok) {
                throw new Error("Erro HTTP: " + resposta.status);
            }

            const filmes = await resposta.json();

            listaFilmes.innerHTML = "";

            if (filmes.length === 0) {

                listaFilmes.innerHTML =
                    '<p class="estado">Nenhum filme cadastrado ainda.</p>';

                return;
            }

            filmes.forEach((filme) => {

                const card = document.createElement("article");
                card.className = "card";

                let areaImagem;

                if (filme.imagem) {

                    areaImagem = document.createElement("img");
                    areaImagem.className = "card-imagem";
                    areaImagem.src = filme.imagem;
                    areaImagem.alt = "Capa de " + filme.nome;
                    areaImagem.loading = "lazy";

                    areaImagem.onerror = () => {

                        const placeholder = document.createElement("div");

                        placeholder.className = "card-placeholder";
                        placeholder.textContent = "🎬";

                        areaImagem.replaceWith(placeholder);

                    };

                } else {

                    areaImagem = document.createElement("div");
                    areaImagem.className = "card-placeholder";
                    areaImagem.textContent = "🎬";

                }

                const faixa = document.createElement("div");
                faixa.className = "card-faixa";

                const conteudo = document.createElement("div");
                conteudo.className = "card-conteudo";

                const nome = document.createElement("h3");
                nome.textContent = "🎬 " + (filme.nome || "Filme sem nome");

                const genero = document.createElement("p");
                genero.textContent = "🎭 Gênero: " + (filme.genero || "-");

                const plataforma = document.createElement("p");
                plataforma.textContent = "📺 Plataforma: " + (filme.plataforma || "-");

                const ano = document.createElement("p");
                ano.textContent = "📅 Lançamento: " + (filme.anoLancamento || "-");

                const descricao = document.createElement("p");
                descricao.className = "descricao";
                descricao.textContent =
                    filme.descricao || "Sem descrição cadastrada.";

                conteudo.append(nome, genero, plataforma, ano, descricao);

                card.append(areaImagem, faixa, conteudo);

                listaFilmes.appendChild(card);

            });

        } catch (erro) {

            console.error("Erro ao buscar filmes:", erro);

            listaFilmes.innerHTML =
                '<p class="estado erro">Não foi possível carregar os filmes. Verifique se a API está funcionando.</p>';

        }

    }


    // POST: Cadastrar filme

    formFilme.addEventListener("submit", async (event) => {

        event.preventDefault();

        const filme = {

            id: Number(document.getElementById("id").value),

            nome: document.getElementById("nome").value.trim(),

            genero: document.getElementById("genero").value.trim(),

            plataforma: document.getElementById("plataforma").value.trim(),

            anoLancamento: Number(document.getElementById("anoLancamento").value),

            imagem: document.getElementById("imagem").value.trim(),

            descricao: document.getElementById("descricao").value.trim()

        };

        mensagem.textContent = "Enviando cadastro...";
        mensagem.className = "";

        btnCadastrar.disabled = true;

        try {

            const resposta = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(filme)

            });

            if (!resposta.ok) {

                const detalhe = await resposta.text();

                throw new Error(detalhe || "Erro HTTP: " + resposta.status);

            }

            mensagem.textContent = "✔ Filme cadastrado com sucesso!";
            mensagem.className = "sucesso";

            formFilme.reset();

            await listarFilmes();

        } catch (erro) {

            console.error("Erro ao cadastrar filme:", erro);

            mensagem.textContent =
                "✖ Não foi possível cadastrar o filme. Verifique a API.";

            mensagem.className = "erro";

        } finally {

            btnCadastrar.disabled = false;

        }

    });


    // Botão para atualizar a lista

    document.getElementById("btnAtualizar").addEventListener("click", listarFilmes);


    // Carregar filmes ao abrir a página

    listarFilmes();

</script>

</body>
</html>
